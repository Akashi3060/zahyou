[package]
name = "zahyou-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "zahyou のネットワーク: 更新の確認と入れ替え、星図データのダウンロード、天体名の解決、nova.astrometry.net"

[dependencies]
# 落とした索引ファイルの検査(表の大きさ・kd-tree の形まで。ヘッダーだけ読む)
zahyou-index = { workspace = true }
# TLS は rustls(ring)。gzip は付けない(Range で続きから落とすときに Content-Length がずれるため)
ureq = { version = "3", default-features = false, features = ["rustls"] }
# preserve_order: cache.json のキーの順を Python 版と同じに保つ。float_roundtrip: 実数を読み書きしても 1 ビットも変えない
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
# 空き容量(GetDiskFreeSpaceExW)。自分で unsafe を書かないため
fs4 = "0.13"
