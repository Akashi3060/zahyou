[package]
name = "zahyou-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
zahyou-wcs = { workspace = true }
rayon = { workspace = true }
flate2 = { workspace = true }
image = { workspace = true }
# TIFF は Pillow と同じ型(16 bit の符号付き・32 bit 整数・浮動小数)まで読むため、image が使う tiff を直接使う(MIT)
tiff = "0.11"

[dev-dependencies]
# 試験で Python 基準実装の値(rs/testdata/image_*.json)を読むだけ。float_roundtrip で小数の読み取りを正確にする
serde_json = { version = "1", features = ["float_roundtrip"] }

[[example]]
name = "bench_image"
